<!DOCTYPE html>

<html>

   <head>
      <title>Request Header Parser</title>
      <link rel="shortcut icon" href="https://cdn.hyperdev.com/us-east-1%3A52a203ff-088b-420f-81be-45bf559d01b1%2Ffavicon.ico" type="image/x-icon"/>
      <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" type="text/css">
      <link href="style.css" rel="stylesheet" type="text/css">
   </head>

   <body>
      <div class="container">
        <h1>URL Shortener Microservice</h1>
        <main>
          <h2>Short URL Creation</h2>
          <p> Example:POST [project_url]/api/shorturl - https://www.google.com </p>
          <section class="section">
            <form method="post" action="api/shorturl">
              <fieldset>
                <legend>URL Shortener</legend>
                <label for="url_input">URL:</label>
                <input id="url_input" type="text" name="url" placeholder="https://www.freecodecamp.org/">
                <input type="submit" value="POST URL">
              </fieldset>
            </form>
          </section>
        </main>
        <h2>
          Example Usage: 
        </h2>
        <p>
          <a href="api/shorturl/3">[this_project_url]/api/sorturl/3</a>
        </p>
        <h3>
          Will Redirect to:
        </h3>
        <p>https://forum.freecodecamp.org/</p>
      </div>
      <div class="footer">
        <p>
          By <a href="https://www.freecodecamp.org">freeCodeCamp</a>
        </p>
      </div>
   </body>


</html>
